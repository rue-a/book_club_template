name: Review book
description: Issue to add a written review to a book existing in the books database.
title: "Add review to book: enter-book-title-here"
labels: ["review"]
body:
  - type: markdown
    attributes:
      value: |
        Upon finding a book with the provided ID in the books database and if the provided reviewer is a participant for this book, the review text is inserted accordingly.

        > [!WARNING]
        > Submitting a review for a reviewer who has already reviewed this book will **overwrite** the existing review without warning.

  - type: input
    id: book-id
    attributes:
      label: Book ID
      description: "OpenLibrary key: begins with `OL` and ends with `W`, find it on the right below the cover at https://rue-a.github.io/sff-zirkel/"
      placeholder: OL...W
    validations:
      required: true

  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      placeholder: enter-reviewer-name-here
    validations:
      required: true

  - type: textarea
    id: review
    attributes:
      label: Review
      description: "Your written review of the book. Separate paragraphs with a blank line. Note: markdown formatting (bold, italic, etc.) will be stripped when displayed."
      placeholder: Enter your review here…
    validations:
      required: true
